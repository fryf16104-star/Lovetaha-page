<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>از من خوشت اومده؟ ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 400px;
            padding: 35px 20px;
            text-align: center;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff1493;
            font-size: 27px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 13px 25px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.25s ease;
        }

        #yes {
            background: #ff1493;
            color: white;
        }

        #no {
            background: #eeeeee;
            color: #333;
        }

        #message {
            display: none;
        }

        .big-heart {
            font-size: 75px;
            animation: beat 0.8s infinite alternate;
        }

        .floating-heart {
            position: fixed;
            bottom: -40px;
            font-size: 25px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 5;
        }

        @keyframes beat {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.2);
            }
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div id="question">
            <h1>از من خوشت اومده؟ 🥹</h1>

            <p>راستشو بگوهااا! 😁❤️</p>

            <div class="buttons">
                <button id="yes">آره 😍</button>
                <button id="no">نه 🙈</button>
            </div>
        </div>

        <div id="message">
            <div class="big-heart">❤️</div>

            <h1>بالاخره گفتی آره! 😍</h1>

            <p>
                می‌دونستم یه گوشه‌ی دلت جا دارم! 🥹❤️
            </p>

            <p>حالا لبخند بزن خوشگلم! 💖</p>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const yesButton = document.getElementById("yes");
            const noButton = document.getElementById("no");
            const question = document.getElementById("question");
            const message = document.getElementById("message");

            let yesScale = 1;
            let noScale = 1;

            noButton.addEventListener("click", function () {
                noScale = Math.max(0.35, noScale - 0.15);
                yesScale += 0.2;

                noButton.style.transform = "scale(" + noScale + ")";
                yesButton.style.transform = "scale(" + yesScale + ")";
            });

            yesButton.addEventListener("click", function () {
                question.style.display = "none";
                message.style.display = "block";

                for (let i = 0; i < 25; i++) {
                    setTimeout(createHeart, i * 120);
                }
            });

            function createHeart() {
                const heart = document.createElement("div");

                heart.className = "floating-heart";
                heart.textContent = ["❤️", "💖", "💕", "💗"][
                    Math.floor(Math.random() * 4)
                ];

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                document.body.appendChild(heart);

                setTimeout(function () {
                    heart.remove();
                }, 6000);
            }

        });
    </script>

</body>
</html>
